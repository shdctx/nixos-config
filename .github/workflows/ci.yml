name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel older runs of the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: nix flake check
        run: nix flake check --no-update-lock-file --print-build-logs

  build:
    name: Build ${{ matrix.host }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [shdctx]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false # slow, and the rest frees enough space

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: shdctx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build system
        run: >-
          nix build --no-update-lock-file --print-build-logs
          ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
